[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-making-tesi"
version = "0.1.0"
description = "Valutazione di una strategia di market making su dati LOB L2, L3 e L4"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyarrow>=15", "psutil>=5.9"]

[project.optional-dependencies]
notebooks = ["jupyter>=1.0", "matplotlib>=3.7"]

[project.scripts]
mm-backtest = "market_making_tesi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
